name: Preview Screen (Intraday)

# Manual only. Triggered by the ▶ Run button in the worker (workflow_dispatch
# via the GitHub API). Writes data/preview.json ONLY — never touches the
# official lifecycle ledger, so an intraday run cannot alter the accepted record.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-screen
  cancel-in-progress: true   # a newer tap supersedes an in-flight preview

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intraday preview screen
        env:
          MARKET: MYX
          MIN_UNIVERSE: ${{ vars.MIN_UNIVERSE || '800' }}
          TV_MAX_WORKERS: ${{ vars.TV_MAX_WORKERS || '5' }}
          TV_BARS: ${{ vars.TV_BARS || '300' }}
          TV_CONNECT_GAP: ${{ vars.TV_CONNECT_GAP || '0.25' }}
        run: python export_terminal.py --mode preview

      - name: Commit preview
        run: |
          git config user.name  "terminal-bot"
          git config user.email "terminal-bot@users.noreply.github.com"
          git add data/preview.json
          git commit -m "preview screen $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || echo "no changes"
          git push
