name: Close Screen (Official)

# Official after-close screen. 17:18 MYT on Bursa trading days.
# 17:18 MYT == 09:18 UTC. Mon-Fri; holiday guard is the latest-bar check
# inside export_terminal (it fails closed if the universe is too thin).
on:
  schedule:
    - cron: "18 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: close-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run official close screen
        env:
          MARKET: MYX
          MIN_UNIVERSE: ${{ vars.MIN_UNIVERSE || '800' }}
          TV_MAX_WORKERS: ${{ vars.TV_MAX_WORKERS || '5' }}
          TV_BARS: ${{ vars.TV_BARS || '300' }}
          TV_CONNECT_GAP: ${{ vars.TV_CONNECT_GAP || '0.25' }}
        run: python export_terminal.py --mode close

      - name: Commit results + lifecycle ledger
        run: |
          git config user.name  "terminal-bot"
          git config user.email "terminal-bot@users.noreply.github.com"
          git add data/today.json data/history.json data/active.json data/removals.json
          git commit -m "close screen $(date -u +%Y-%m-%d) [skip ci]" || echo "no changes"
          git push
