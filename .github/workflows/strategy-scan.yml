name: strategy-scan

# Manual/intraday PREVIEW. This is the workflow the app's Run button triggers
# (the worker dispatches strategy-scan.yml). POSTs to the worker's /api/preview,
# so it never changes the official record.
on:
  workflow_dispatch:

concurrency:
  group: preview-scan
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run preview screen and publish
        env:
          MARKET: MYX
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          TV_MAX_WORKERS: ${{ vars.TV_MAX_WORKERS || '5' }}
          TV_BARS: ${{ vars.TV_BARS || '300' }}
          TV_CONNECT_GAP: ${{ vars.TV_CONNECT_GAP || '0.25' }}
        run: python pipeline.py --mode preview
